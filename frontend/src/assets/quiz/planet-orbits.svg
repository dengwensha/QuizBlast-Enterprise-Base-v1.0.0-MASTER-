<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Güneş Sistemi gezegenlerinin çaplarının karşılaştırılması</title><desc id="desc">Sekiz gezegen, yaklaşık çap oranlarını koruyacak şekilde temsil edilir; isimleri ve cevap işareti gösterilmez.</desc><rect width="800" height="500" rx="24" fill="#0c213d"/><text x="400" y="51" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#ffffff">Gezegen boyutları</text><text x="400" y="83" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#d0e3f9">Yaklaşık çap oranları • isimler gizli</text><line x1="55" y1="245" x2="745" y2="245" stroke="#54718e" stroke-width="2" opacity=".55"/><circle data-planet="Mercury" data-diameter-km="4879" cx="109" cy="171" r="3.315" fill="#b3bcc8" stroke="#edf7ff" stroke-width="1.4"/><circle data-planet="Venus" data-diameter-km="12104" cx="279" cy="171" r="8.224" fill="#c9a86d" stroke="#edf7ff" stroke-width="1.4"/><circle data-planet="Earth" data-diameter-km="12742" cx="450" cy="171" r="8.657" fill="#5ba9db" stroke="#edf7ff" stroke-width="1.4"/><circle data-planet="Mars" data-diameter-km="6779" cx="624" cy="171" r="4.606" fill="#c87958" stroke="#edf7ff" stroke-width="1.4"/><circle data-planet="Jupiter" data-diameter-km="139820" cx="142" cy="345" r="95.000" fill="#d2ab84" stroke="#edf7ff" stroke-width="1.4"/><circle data-planet="Saturn" data-diameter-km="116460" cx="390" cy="345" r="79.128" fill="#e5cc96" stroke="#edf7ff" stroke-width="1.4"/><circle data-planet="Uranus" data-diameter-km="50724" cx="591" cy="345" r="34.464" fill="#91d3d3" stroke="#edf7ff" stroke-width="1.4"/><circle data-planet="Neptune" data-diameter-km="49244" cx="730" cy="345" r="33.459" fill="#628ac9" stroke="#edf7ff" stroke-width="1.4"/><text x="400" y="479" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#d1e5f9">Çaplar orantılıdır; gezegenler arası uzaklıklar ölçekli değildir.</text></svg>