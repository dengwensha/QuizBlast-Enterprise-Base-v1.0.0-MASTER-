<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Güneş Sistemi'nin şematik yörüngeleri</title><desc id="desc">Güneş ve çevresinde gezegenleri temsil eden sekiz işaret. Gezegen işaretlerinin boyutları ölçekli değildir.</desc><rect width="800" height="500" rx="24" fill="#0c213d"/><circle cx="145" cy="250" r="56" fill="#ffd176"/><circle cx="145" cy="250" r="68" stroke="#f6ce75" stroke-width="2" fill="none" opacity=".4"/><g fill="none" stroke="#587797" stroke-width="2" opacity=".65"><ellipse cx="145" cy="250" rx="103" ry="89"/><ellipse cx="145" cy="250" rx="155" ry="127"/><ellipse cx="145" cy="250" rx="211" ry="158"/><ellipse cx="145" cy="250" rx="270" ry="191"/><ellipse cx="145" cy="250" rx="340" ry="223"/><ellipse cx="145" cy="250" rx="415" ry="243"/><ellipse cx="145" cy="250" rx="490" ry="263"/><ellipse cx="145" cy="250" rx="562" ry="285"/></g><g fill="#b9ddfa" stroke="#edf7ff" stroke-width="2"><circle cx="244" cy="235" r="7"/><circle cx="280" cy="194" r="9"/><circle cx="344" cy="185" r="10"/><circle cx="405" cy="241" r="7"/><circle cx="477" cy="184" r="11"/><circle cx="537" cy="251" r="11"/><circle cx="607" cy="179" r="9"/><circle cx="696" cy="251" r="9"/></g><text x="400" y="46" fill="white" font-family="sans-serif" text-anchor="middle" font-size="25">Gezegen yörüngeleri</text><text x="400" y="478" fill="#d1e5f9" font-family="sans-serif" text-anchor="middle" font-size="18">Gösterim ölçekli değildir • En büyük gezegen işaretlenmemiştir</text></svg>