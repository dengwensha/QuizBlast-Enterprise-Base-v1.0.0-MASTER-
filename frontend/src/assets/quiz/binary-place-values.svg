<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Dört basamaklı ikili sayı yer değeri şeması</title><desc id="desc">Soldan sağa 8, 4, 2 ve 1 yer değerli dört kutu. Sorudaki bitler veya onluk karşılık yer almıyor.</desc><rect width="800" height="500" rx="24" fill="#f1f8ff"/><text x="400" y="100" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="bold" fill="#183d67">İkili sayı sistemi</text><text x="400" y="150" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#426587">Basamak değerleri</text><g font-family="sans-serif" text-anchor="middle" font-size="48" font-weight="bold"><rect x="90" y="190" width="135" height="140" rx="18" fill="#d6ebff" stroke="#4c88bf" stroke-width="4"/><rect x="250" y="190" width="135" height="140" rx="18" fill="#d6ebff" stroke="#4c88bf" stroke-width="4"/><rect x="410" y="190" width="135" height="140" rx="18" fill="#d6ebff" stroke="#4c88bf" stroke-width="4"/><rect x="570" y="190" width="135" height="140" rx="18" fill="#d6ebff" stroke="#4c88bf" stroke-width="4"/><text x="157" y="277" fill="#204d7b">8</text><text x="317" y="277" fill="#204d7b">4</text><text x="477" y="277" fill="#204d7b">2</text><text x="637" y="277" fill="#204d7b">1</text></g><text x="400" y="403" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#516f8d">Her basamak 0 veya 1 değerini alır</text></svg>