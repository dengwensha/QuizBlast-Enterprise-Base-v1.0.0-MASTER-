<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">İstanbul Boğazı şematik haritası</title><desc id="desc">İki kara parçası arasında uzanan dar bir su yolu ve iki geniş su alanı. Su alanlarının isimleri verilmemiştir.</desc><rect width="800" height="500" rx="24" fill="#eaf5ff"/><path d="M0 0H305C260 74 305 130 274 190S255 290 295 350L250 500H0Z" fill="#c7e3bd" stroke="#82ab80" stroke-width="4"/><path d="M800 0H495C540 74 495 130 526 190S545 290 505 350L550 500H800Z" fill="#c7e3bd" stroke="#82ab80" stroke-width="4"/><path d="M305 0C260 74 305 130 274 190S255 290 295 350L250 500M495 0C540 74 495 130 526 190S545 290 505 350L550 500" fill="none" stroke="#2e7db8" stroke-width="5"/><path d="M370 40V460M430 40V460" stroke="#98caed" stroke-width="3" stroke-dasharray="12 16"/><text x="85" y="240" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#315b45">Kara</text><text x="710" y="240" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#315b45">Kara</text><text x="400" y="250" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#125d98" transform="rotate(-90 400 250)">Boğaz</text><text x="400" y="36" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#426c8d">Şematik gösterim • ölçekli değildir</text></svg>