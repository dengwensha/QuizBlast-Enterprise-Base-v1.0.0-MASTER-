<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">İki dirençli elektrik devresi şeması</title><desc id="desc">Bir pil ve tek kapalı devre halkasında seri olarak yerleştirilmiş iki direnç; akım yönü ya da cevap bilgisi gösterilmiyor.</desc><rect width="800" height="500" rx="24" fill="#f1f8ff"/><text x="400" y="64" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#234768">Elektrik devresi • şematik gösterim</text><g fill="none" stroke="#315779" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M120 210V125H255M335 125H475M555 125H680V370H120V240"/><path d="M255 125H265M325 125H335M475 125H485M545 125H555"/></g><rect x="265" y="100" width="60" height="50" rx="5" fill="#ffe8a4" stroke="#315779" stroke-width="6"/><rect x="485" y="100" width="60" height="50" rx="5" fill="#ffe8a4" stroke="#315779" stroke-width="6"/><text x="295" y="90" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#234768">R1</text><text x="515" y="90" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#234768">R2</text><path d="M94 210H146M104 228H136" stroke="#315779" stroke-width="6"/><text x="85" y="215" text-anchor="end" font-family="sans-serif" font-size="22" fill="#234768">+</text><text x="85" y="242" text-anchor="end" font-family="sans-serif" font-size="22" fill="#234768">−</text><text x="400" y="443" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#56718d">Ölçekli değildir • Akım şiddeti belirtilmemiştir</text></svg>