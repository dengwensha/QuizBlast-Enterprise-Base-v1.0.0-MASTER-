<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Bir hücre organelinin kesit çizimi</title><desc id="desc">Çift zarla çevrili oval bir organel ve iç zarın kıvrımları çizilmiş; organelin adı yazılmamıştır.</desc><rect width="800" height="500" rx="24" fill="#f4f9ff"/><ellipse cx="400" cy="250" rx="285" ry="157" fill="#f9b9a2" stroke="#8f4869" stroke-width="9" transform="rotate(-8 400 250)"/><ellipse cx="400" cy="250" rx="257" ry="132" fill="#ffe2bf" stroke="#ac6d73" stroke-width="7" transform="rotate(-8 400 250)"/><path d="M170 255C214 177 248 339 287 233S364 177 382 244 429 339 461 223 535 150 555 237 584 294 628 244" fill="none" stroke="#b56580" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><g fill="#b86a88"><circle cx="240" cy="270" r="7"/><circle cx="333" cy="297" r="6"/><circle cx="475" cy="293" r="8"/><circle cx="563" cy="195" r="6"/></g><text x="400" y="66" font-family="sans-serif" text-anchor="middle" font-size="26" fill="#273e61">Hücre organeli • şematik kesit</text><text x="400" y="463" font-family="sans-serif" text-anchor="middle" font-size="17" fill="#516c87">Görselde organelin adı belirtilmemiştir</text></svg>