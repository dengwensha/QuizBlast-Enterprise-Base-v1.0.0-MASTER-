name: Production Build Verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: production-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SECRET_KEY: ci-only-secret-not-for-production
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate pinned Python dependencies
        shell: bash
        run: |
          invalid=0

          while IFS= read -r requirement; do
            case "$requirement" in
              ""|\#*)
                continue
                ;;
            esac

            if [[ "$requirement" != *"=="* ]]; then
              echo "Unpinned requirement: $requirement"
              invalid=1
            fi
          done < backend/requirements.txt

          if [[ "$invalid" -ne 0 ]]; then
            exit 1
          fi

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production images
        run: docker compose build --pull backend frontend

      - name: Verify optional remote frontend image and proxy template
        shell: bash
        run: |
          docker build -f frontend/Dockerfile.remote \
            -t quizblast-remote-ci frontend
          # No Railway account or public deployment required for this check.
          docker run --rm -e QB_BACKEND_UPSTREAM=127.0.0.1:8000 \
            quizblast-remote-ci nginx -t
          docker run --rm -e QB_BACKEND_UPSTREAM=127.0.0.1:8000 \
            quizblast-remote-ci nginx -T 2>&1 \
            | grep -F 'proxy_pass http://127.0.0.1:8000/;'
          docker run --rm -e QB_BACKEND_UPSTREAM=127.0.0.1:8000 \
            quizblast-remote-ci nginx -T 2>&1 \
            | grep -F 'proxy_set_header Host $host;'

      - name: Verify Render single-service build and proxy
        shell: bash
        run: |
          docker build -f Dockerfile.render -t quizblast-render-ci .
          docker run --rm -e PORT=10000 quizblast-render-ci \
            python /app/render_start.py --check
          docker run --rm -e PORT=10000 quizblast-render-ci \
            sh -c 'python /app/render_start.py --check && nginx -T 2>&1' \
            | grep -F 'proxy_pass http://127.0.0.1:8000/;'
          docker run --rm -e PORT=10000 quizblast-render-ci \
            sh -c 'python /app/render_start.py --check && nginx -T 2>&1' \
            | grep -F 'listen 10000;'

      - name: Start infrastructure
        run: docker compose up -d postgres redis

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres \
              pg_isready -U quizblast -d quizblast; then
              exit 0
            fi

            sleep 2
          done

          docker compose logs postgres
          exit 1

      - name: Wait for Redis
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T redis redis-cli ping |
              grep -q "PONG"; then
              exit 0
            fi

            sleep 2
          done

          docker compose logs redis
          exit 1

      - name: Run backend regression modules
        shell: bash
        run: |
          modules=(
            app.tests.test_answer_acceptance
            app.tests.test_game_progression
            app.tests.test_game_recovery
            app.tests.test_quiz_room_deletion_manual
            app.tests.test_quiz_question_freeze_manual
            app.tests.test_room_connections
            app.tests.test_duplicate_detector_manual
            app.tests.test_host_authorization_manual
            app.tests.test_http_perimeter_manual
            app.tests.test_import_commit_trust_boundary_manual
            app.tests.test_import_pipeline_manual
            app.tests.test_import_preview_manual
            app.tests.test_import_report_manual
            app.tests.test_qbds_mapper_manual
            app.tests.test_validation_engine_manual
            app.tests.test_content_catalog_manual
            app.tests.test_content_copy_manual
            app.tests.test_content_play_manual
            app.tests.test_content_seed_manual
            app.tests.test_content_deploy_manual
          )

          for module in "${modules[@]}"; do
            echo "RUN — $module"

            docker compose run --rm --no-deps backend \
              python -m "$module"
          done

      - name: Start production application
        run: docker compose up -d backend frontend

      - name: Verify backend readiness
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://localhost:8001/ \
              --output /tmp/quizblast-backend-status.json && \
              grep -q '"status":"running"' \
                /tmp/quizblast-backend-status.json; then
              exit 0
            fi

            sleep 2
          done

          docker compose logs backend
          exit 1

      - name: Verify same-origin API proxy
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://localhost:5173/api/ \
              --output /tmp/quizblast-proxy-status.json &&
              grep -q '"status":"running"' \
                /tmp/quizblast-proxy-status.json; then
              exit 0
            fi

            sleep 2
          done

          docker compose logs frontend backend
          exit 1

      - name: Verify host player display game flow
        run: |
          docker compose exec -T backend \
            python -m app.tests.test_game_flow_manual

      - name: Verify active game survives backend restart
        run: |
          docker compose exec -T backend \
            python -m app.tests.test_game_restart_manual

      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Verify browser game recovery (isolated scenarios)
        working-directory: frontend
        shell: bash
        run: |
          # One scenario per process. Reset only the CI backend's in-memory
          # registration limiter between scenarios; production limits stay intact.
          scenarios=(
            "UI-08F-B06 saved player session"
            "host recovers an open room"
            "host, player and display recover"
            "UI-09A result and leaderboard remain synchronized"
            "active host session remains"
            "active player session remains"
            "QB-AUTH-GUEST-01 anonymous PIN join"
            "QB-AUTH-DISPLAY-01 anonymous Display"
            "QB-AUTH-DISPLAY-02 F5 handles overlapping Display sockets"
            "UI-06A player Join Game"
            "UI-08F-B05 QR link"
            "UI-07B QR link"
            "UI-07D mobile QR"
          )
          for scenario in "${scenarios[@]}"; do
            echo "::group::Browser scenario: ${scenario}"
            docker compose restart backend
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://localhost:8001/ | grep -q '"status":"running"'; then
                break
              fi
              if [[ "$attempt" == 30 ]]; then
                docker compose logs --tail=100 backend
                exit 1
              fi
              sleep 2
            done
            npx playwright test tests/recovery.spec.js --grep "${scenario}" --workers=1 --reporter=line
            echo "::endgroup::"
          done

      - name: Install Microsoft Edge for browser regression
        working-directory: frontend
        run: npx playwright install msedge

      - name: Reset process-local CI auth limiter before Edge regression
        # Limiter lives in backend process memory, not Redis. CI only.
        run: |
          docker compose restart backend
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8001/ \
              --output /tmp/quizblast-edge-ready.json && \
              grep -q '"status":"running"' /tmp/quizblast-edge-ready.json; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Verify repeated Back in Microsoft Edge
        working-directory: frontend
        run: npx playwright test tests/recovery.spec.js --config=playwright.edge.config.js --grep "UI-06A player Join Game" --reporter=line

      - name: Show backend logs on browser test failure
        if: failure()
        run: docker compose logs --tail=200 backend

      - name: Verify frontend static serving and SPA fallback
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://localhost:5173/ \
              --output /tmp/quizblast-index.html; then
              break
            fi

            if [[ "$attempt" -eq 30 ]]; then
              docker compose logs frontend
              exit 1
            fi

            sleep 2
          done

          grep -q '<div id="root"></div>' \
            /tmp/quizblast-index.html

          curl --fail --silent --show-error \
            http://localhost:5173/host/deep-link-check \
            --output /tmp/quizblast-deep-link.html

          cmp --silent \
            /tmp/quizblast-index.html \
            /tmp/quizblast-deep-link.html

      - name: Show final service state
        run: docker compose ps

      - name: Clean up containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
